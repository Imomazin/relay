name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        # The app renders dynamically (no DB access at build time); a
        # syntactically-valid placeholder URL satisfies module initialisation.
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/relay
          RELAY_DISABLE_AUTOSEED: "1"
        run: npm run build
